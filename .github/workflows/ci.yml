name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Chromium and its system libraries
        run: |
          mvn -B -q compile org.codehaus.mojo:exec-maven-plugin:3.1.0:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: Run tests (Chromium, headless)
        env:
          VALID_EMAIL: ${{ secrets.VALID_EMAIL }}
          VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        run: |
          mvn -B test \
            -Dbrowser=chromium \
            -Dheadless=true \
            "-DvalidEmail=$VALID_EMAIL" \
            "-DvalidPassword=$VALID_PASSWORD"

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload Allure results and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure
          path: |
            target/allure-results
            target/site/allure-maven-plugin
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure evidence (screenshots, traces, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            reports/screenshots
            reports/traces
            reports/videos
            target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14